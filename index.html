<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifra Local - Mi Repertorio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffb100">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0A0A0F] text-[#E2E8F0] h-screen flex overflow-hidden">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito'))
                    .catch(err => console.error('Error registrando Service Worker', err));
            });
        }
    </script>

    <!-- MODAL DE AGREGAR CANCIÓN -->
    <div id="modal-song" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-[100] p-4">
        <div class="bg-slate-800 w-full max-w-2xl rounded-xl shadow-2xl border border-slate-700 flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="text-xl font-bold text-orange-500">Nueva Canción</h3>
                <button id="btn-close-modal" class="text-slate-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-6 space-y-4 overflow-y-auto">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Artista</label>
                        <input type="text" id="input-artist" class="w-full p-2 bg-slate-700 text-white rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Título</label>
                        <input type="text" id="input-title" class="w-full p-2 bg-slate-700 text-white rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Tono Original</label>
                    <input type="text" id="input-key" placeholder="Ej: Em" class="w-full p-2 bg-slate-700 text-white rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Letra y Acordes</label>
                    <textarea id="input-content" rows="12" class="w-full p-2 bg-slate-700 text-white rounded-lg font-mono focus:ring-2 focus:ring-orange-500 outline-none" placeholder="Pega aquí la canción..."></textarea>
                </div>
            </div>
            <div class="p-4 border-t border-slate-700 flex justify-end gap-3">
                <button id="btn-cancel-modal" class="px-4 py-2 text-slate-400 hover:text-white transition-colors">Cancelar</button>
                <button id="btn-save-manual" class="px-6 py-2 bg-[#BD00FF] hover:bg-[#a300e0] text-white rounded-lg font-bold transition-colors shadow-[0_0_15px_rgba(189,0,255,0.4)]">Guardar Canción</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE SETLIST -->
    <div id="modal-setlist" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-[100] p-4">
        <div class="bg-slate-800 w-full max-w-md rounded-xl shadow-2xl border border-slate-700 p-6">
            <h3 class="text-xl font-bold text-orange-500 mb-4">Crear Nuevo Setlist</h3>
            <input type="text" id="input-setlist-name" placeholder="Ej: Domingo Servicio" class="w-full p-2 bg-slate-700 text-white rounded-lg focus:ring-2 focus:ring-orange-500 outline-none mb-6">
            <div class="flex justify-end gap-3">
                <button id="btn-close-setlist" class="px-4 py-2 text-slate-400 hover:text-white transition-colors">Cancelar</button>
                <button id="btn-save-setlist" class="px-6 py-2 bg-orange-600 hover:bg-orange-500 text-white rounded-lg font-bold transition-colors">Crear Lista</button>
            </div>
        </div>
    </div>

    <!-- VISTA PANTALLA COMPLETA (FOCUS MODE) -->
    <div id="fullscreen-view" class="hidden fixed inset-0 bg-[#0A0A0F] z-[200] flex flex-col overflow-hidden">
        <header class="p-6 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="flex items-center bg-slate-700 rounded-lg p-1">
                    <button id="fs-transpose-down" class="px-3 py-1 hover:bg-slate-600 rounded transition-colors font-bold text-[#00FFCC] hover:text-white shadow-[0_0_5px_rgba(0,255,204,0.3)]">-</button>
                    <span id="fs-current-key" class="px-4 font-mono text-[#00FFCC]">Tono: Em</span>
                    <button id="fs-transpose-up" class="px-3 py-1 hover:bg-slate-600 rounded transition-colors font-bold text-[#00FFCC] hover:text-white shadow-[0_0_5px_rgba(0,255,204,0.3)]">+</button>
                </div>
            </div>
            <button id="btn-close-fullscreen" class="text-slate-400 hover:text-white text-4xl transition-colors">&times;</button>
        </header>
        <section class="flex-1 overflow-y-auto p-12 flex justify-center bg-slate-900">
            <div id="fs-song-content" class="max-w-4xl w-full font-mono text-3xl leading-relaxed whitespace-pre-wrap">
                <!-- Contenido de la canción en pantalla completa -->
            </div>
        </section>
    </div>

    <!-- Barra Lateral -->
    <aside class="w-80 bg-slate-800 border-r border-slate-700 flex flex-col">
        <div class="p-4 border-b border-slate-700">
            <div class="flex items-center gap-3 mb-4">
                <img src="logo.png" alt="Logo" class="w-10 h-10 object-contain flex-shrink-0">
                <h1 class="text-2xl font-black tracking-tighter text-[#ffb100]">MonoCHORD</h1>
            </div>
            <div class="relative">
                <input type="text" id="search-input" placeholder="Buscar artista o canción..." class="w-full p-2 pl-3 bg-slate-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 transition-all">
            </div>
        </div>

        <!-- Sección de Setlists -->
        <div class="p-4 border-b border-slate-700">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Mis Setlists</h2>
                <button id="btn-add-setlist" class="text-[#A78BFA] hover:text-[#c4b5fd] text-sm font-bold">+ Nueva Lista</button>
            </div>
            <div id="setlist-container" class="space-y-1 max-h-48 overflow-y-auto">
                <!-- Aquí se cargarán los setlists -->
                <p class="text-slate-600 text-xs italic text-center py-2">No hay listas creadas</p>
            </div>
        </div>

        <!-- Botón para ver todas las canciones -->
        <div class="px-4 py-2">
            <button id="btn-show-all-songs" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm font-medium transition-all border border-slate-600 flex items-center justify-center gap-2">
                <span>📚</span> Todas las Canciones
            </button>
        </div>

        <!-- Lista de canciones -->
        <div id="song-list" class="flex-1 overflow-y-auto p-2 space-y-1">
            <p class="text-slate-500 text-center mt-10 italic">Busca una canción para empezar</p>
        </div>

        <!-- Footer de la Barra Lateral (Acciones) -->
        <div class="p-4 bg-slate-900 border-t border-slate-700 space-y-3">
            <div class="flex gap-2">
                <button id="btn-edit-current" class="flex-1 py-2 bg-[#a700ff] hover:bg-[#8a00d7] text-white rounded-lg font-medium transition-colors text-sm shadow-[0_0_15px_rgba(167,0,255,0.4)]">
                    Editar
                </button>
                <button id="btn-add-manual" class="flex-1 py-2 bg-[#00ff01] hover:bg-[#00e600] text-black rounded-lg font-medium transition-colors shadow-[0_0_15px_rgba(0,255,1,0.4)]">
                    + Nueva
                </button>
            </div>
            <div class="flex gap-2">
                <button id="btn-backup" class="flex-1 py-1.5 bg-[#00f2ff] hover:bg-[#00d1db] text-black rounded-lg text-xs font-bold transition-all border border-[#00f2ff] shadow-[0_0_10px_rgba(0,242,255,0.5)]">
                    💾 Backup
                </button>
                <button id="btn-restore" class="flex-1 py-1.5 bg-[#bfff00] hover:bg-[#a3e600] text-black rounded-lg text-xs font-bold transition-all border border-[#bfff00] shadow-[0_0_10px_rgba(191,255,0,0.5)]">
                    🔄 Restaurar
                </button>
            </div>
        </div>
    </aside>

    <!-- Área Principal -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <header id="song-header" class="hidden p-6 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div>
                    <h2 id="view-title" class="text-3xl font-bold">Nombre de la Canción</h2>
                    <p id="view-artist" class="text-slate-400 text-lg">Artista</p>
                </div>
                <!-- Botón Añadir a Setlist -->
                <button id="btn-add-to-list" class="ml-4 px-3 py-1 bg-slate-700 hover:bg-[#BD00FF] text-slate-300 hover:text-white rounded-full text-xs font-bold transition-all border border-slate-600">
                    + Añadir a Lista
                </button>
                <button id="btn-fullscreen" class="ml-2 px-3 py-1 bg-slate-700 hover:bg-orange-500 text-slate-300 hover:text-white rounded-full text-xs font-bold transition-all border border-slate-600">
                    ⛶ Pantalla Completa
                </button>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center bg-slate-700 rounded-lg p-1">
                    <button id="transpose-down" class="px-3 py-1 hover:bg-slate-600 rounded transition-colors font-bold text-[#00FFCC] hover:text-white shadow-[0_0_5px_rgba(0,255,204,0.3)]">-</button>
                    <span id="current-key" class="px-4 font-mono text-[#00FFCC]">Tono: Em</span>
                    <button id="transpose-up" class="px-3 py-1 hover:bg-slate-600 rounded transition-colors font-bold text-[#00FFCC] hover:text-white shadow-[0_0_5px_rgba(0,255,204,0.3)]">+</button>
                </div>
            </div>
        </header>

        <section id="song-content-container" class="flex-1 overflow-y-auto p-8 flex justify-center bg-slate-900">
            <div id="song-content" class="max-w-3xl w-full font-mono text-xl leading-relaxed whitespace-pre-wrap">
                <div class="text-center text-slate-500 mt-20">
                    <p class="text-5xl mb-4">🎵</p>
                    <p>Selecciona una canción de la izquierda para visualizarla</p>
                </div>
            </div>
        </section>
    </main>

    <script src="db-browser.js"></script>
    <script src="renderer.js?v=1.1"></script>
</body>
</html>
